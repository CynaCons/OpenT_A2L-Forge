name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: windows-x64
          - platform: ubuntu-22.04
            artifact_name: linux-x64
          - platform: macos-latest
            artifact_name: macos-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git submodule init
          git submodule update --recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Linux-specific system dependencies for Tauri v2
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev

      - name: Build Tauri app
        run: npx tauri build --no-bundle
        env:
          CI: true

      # Package portable binary
      - name: Package portable binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $binDir = "src-tauri/target/release"
          $zipName = "OpenT-A2L-Forge_${version}_windows-x64.zip"
          Compress-Archive -Path "$binDir/opent_a2l_forge.exe" -DestinationPath $zipName
          echo "ARTIFACT=$zipName" >> $env:GITHUB_ENV

      - name: Package portable binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN_DIR="src-tauri/target/release"
          ZIP_NAME="OpenT-A2L-Forge_${VERSION}_linux-x64.tar.gz"
          tar -czf "$ZIP_NAME" -C "$BIN_DIR" opent_a2l_forge
          echo "ARTIFACT=$ZIP_NAME" >> $GITHUB_ENV

      - name: Package portable binary (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN_DIR="src-tauri/target/release"
          ARCH="${{ matrix.artifact_name }}"
          ZIP_NAME="OpenT-A2L-Forge_${VERSION}_${ARCH}.tar.gz"
          tar -czf "$ZIP_NAME" -C "$BIN_DIR" opent_a2l_forge
          echo "ARTIFACT=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f || ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'OpenT A2L Forge ${{ github.ref_name }}'
          body: |
            ## OpenT A2L Forge ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `.zip` — extract and run `opent_a2l_forge.exe` |
            | Linux x64 | `.tar.gz` — extract and run `./opent_a2l_forge` |
            | macOS ARM64 | `.tar.gz` — extract and run `./opent_a2l_forge` |
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
