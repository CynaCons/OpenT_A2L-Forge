name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/landing/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy screenshots into landing artifact
        run: cp -r docs/screenshots docs/landing/screenshots

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing

      - id: deployment
        uses: actions/deploy-pages@v4
